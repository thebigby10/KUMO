services:
  # ==========================================
  # 1. DATABASE (PostgreSQL)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: kumo_db
    restart: always
    environment:
      POSTGRES_USER: kumo_admin
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: kumo_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kumo-network

  # ==========================================
  # 2. PISTON ENGINE (Code Runner)
  # ==========================================
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: piston_engine
    restart: always
    privileged: true
    environment:
      - PISTON_DISABLE_CGROUPS=true
    ports:
      - "2000:2000"
    volumes:
      - piston_packages:/piston/packages
      - /tmp:/tmp
    networks:
      - kumo-network

  # Helper to install languages automatically on startup
  piston_installer:
    image: node:18-alpine
    container_name: piston_installer
    command: >
      sh -c "
      apk add --no-cache git &&
      git clone https://github.com/engineer-man/piston /tmp/piston &&
      cd /tmp/piston/cli &&
      npm install &&
      echo 'Installing languages...' &&
      node index.js -u http://piston:2000 ppman install python java gcc &&
      echo 'Done!'
      "
    depends_on:
      - piston
    networks:
      - kumo-network

  # ==========================================
  # 3. CODE EXECUTION SERVICE (Python API)
  # ==========================================
  code-execution-service:
    build:
      context: ./code-execution-service
    container_name: code_execution_service
    ports:
      - "8001:8000" # Maps Host 8001 -> Container 8000
    environment:
      - PISTON_URL=http://piston:2000
    depends_on:
      - piston
    networks:
      - kumo-network

  # ==========================================
  # 4. OBJECT STORAGE (MinIO)
  # ==========================================
  minio:
    image: minio/minio
    container_name: minio_storage
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "password123"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - kumo-network

  # ==========================================
  # 5. FILE STORAGE SERVICE (FastAPI)
  # ==========================================
  file-storage-service:
    build:
      context: ./file-storage-service
    container_name: file_storage_service
    ports:
      - "8002:8000" # Maps Host 8002 -> Container 8000
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - MINIO_BUCKET_NAME=kumo-bucket
      # For browser access, we might need localhost here,
      # but for service-to-service, use minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
    depends_on:
      minio:
        condition: service_started
    networks:
      - kumo-network

  # ==========================================
  # 6. AI ASSISTANT SERVICE (RAG-based)
  # ==========================================
  ai-assistant-service:
    build:
      context: ./ai-assistant-service
    container_name: ai_assistant_service
    ports:
      - "8003:8000" # Maps Host 8003 -> Container 8000
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - MINIO_INTERNAL_URL=http://minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
    volumes:
      - chroma_data:/app/chroma_data
    networks:
      - kumo-network

volumes:
  postgres_data:
  piston_packages:
  minio_data:
  chroma_data:

networks:
  kumo-network:
    driver: bridge
